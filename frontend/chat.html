<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DouyinMall AI 客服</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fff5f7 0%, #f6f7fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1f2937;
    }

    .panel {
      width: min(100%, 420px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    #auth-page {
      padding: 32px 28px;
    }

    #auth-page h1 {
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }

    #auth-page p.tip {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
    }

    #auth-page input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #auth-page input:focus,
    #input-area textarea:focus {
      border-color: #fe2c55;
      box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.12);
    }

    #auth-page button,
    #send-btn,
    .ghost-btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    #auth-page button,
    #send-btn {
      background: #fe2c55;
      color: #fff;
    }

    #auth-page button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 4px;
    }

    #auth-page button:hover,
    #send-btn:hover {
      opacity: .9;
    }

    #auth-error {
      min-height: 20px;
      color: #dc2626;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }

    #auth-switch {
      margin-top: 16px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    #auth-switch a {
      color: #fe2c55;
      text-decoration: none;
      margin-left: 4px;
      cursor: pointer;
    }

    #chat-page {
      display: none;
      height: min(760px, calc(100vh - 32px));
      min-height: 600px;
      flex-direction: column;
    }

    #chat-header {
      background: linear-gradient(135deg, #fe2c55, #ff5e7e);
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #chat-header .title {
      font-size: 17px;
      font-weight: 700;
    }

    #chat-header .subtitle {
      font-size: 12px;
      opacity: .88;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 7px 10px;
      font-size: 12px;
    }

    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    #mode-toggle {
      display: flex;
      gap: 8px;
      padding: 12px 14px 0;
    }

    #mode-toggle button {
      flex: 1;
      background: #fff;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    #mode-toggle button.active {
      border-color: #fe2c55;
      background: #fff1f4;
      color: #fe2c55;
      font-weight: 600;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .msg.bot .avatar {
      background: #ffe3ea;
      color: #fe2c55;
    }

    .msg.user .avatar {
      background: #fe2c55;
      color: #fff;
      order: 2;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: #f4f6fb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .msg.user .bubble {
      background: #fe2c55;
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .msg.bot .bubble p { margin: 0 0 8px; }
    .msg.bot .bubble p:last-child { margin-bottom: 0; }
    .msg.bot .bubble ul,
    .msg.bot .bubble ol { margin: 6px 0; padding-left: 18px; }
    .msg.bot .bubble a { color: #fe2c55; }
    .msg.bot .bubble code {
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .bubble.streaming::after {
      content: "...";
      margin-left: 4px;
      animation: blink .8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .stage-tip {
      align-self: center;
      font-size: 12px;
      color: #9ca3af;
      background: #f9fafb;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .suggested {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .suggested button {
      border: 1px solid #fecdd6;
      background: #fff;
      color: #e11d48;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .suggested button:hover {
      background: #fff1f4;
    }

    #input-area {
      border-top: 1px solid #eef2f7;
      padding: 12px 14px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input-area textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 12px;
      resize: none;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      font-family: inherit;
    }

    #send-btn {
      min-width: 84px;
      height: 44px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
    }

    #send-btn:disabled {
      background: #d1d5db;
      cursor: default;
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .panel {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
      #chat-page {
        height: 100vh;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div id="auth-page">
      <h1>DouyinMall</h1>
      <p class="tip">登录后即可体验 AI 智能客服</p>
      <div id="auth-error"></div>
      <input id="email-input" type="email" placeholder="邮箱" autocomplete="email" />
      <input id="pwd-input" type="password" placeholder="密码" autocomplete="current-password" />
      <button id="auth-btn">登录</button>
      <p id="auth-switch">
        <span id="switch-text">没有账号？</span>
        <a id="switch-link">注册</a>
      </p>
    </div>

    <div id="chat-page">
      <div id="chat-header">
        <div>
          <div class="title">AI 智能客服</div>
          <div class="subtitle">支持同步和流式回复，面向 DouyinMall 客服场景</div>
        </div>
        <div class="header-actions">
          <button class="ghost-btn" id="new-session-btn">新会话</button>
          <button class="ghost-btn" id="logout-btn">退出</button>
        </div>
      </div>

      <div id="mode-toggle">
        <button id="btn-sync" class="active" type="button">同步回复</button>
        <button id="btn-stream" type="button">流式回复</button>
      </div>

      <div id="messages"></div>

      <div id="input-area">
        <textarea id="msg-input" rows="1" placeholder="请输入你的问题，例如：我的订单什么时候发货？"></textarea>
        <button id="send-btn" type="button">发送</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8080'

    let token = localStorage.getItem('token') || ''
    let refreshToken = localStorage.getItem('refresh_token') || ''
    let sessionId = localStorage.getItem('session_id') || ''
    let isLogin = true
    let mode = 'sync'
    let sending = false

    if (token) {
      showChat()
    } else {
      showAuth()
    }

    document.getElementById('switch-link').onclick = () => {
      isLogin = !isLogin
      document.getElementById('auth-btn').textContent = isLogin ? '登录' : '注册'
      document.getElementById('switch-link').textContent = isLogin ? '注册' : '登录'
      document.getElementById('switch-text').textContent = isLogin ? '没有账号？' : '已有账号？'
      setAuthError('')
    }

    document.getElementById('auth-btn').onclick = submitAuth
    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitAuth()
    })

    document.getElementById('btn-sync').onclick = () => setMode('sync')
    document.getElementById('btn-stream').onclick = () => setMode('stream')
    document.getElementById('send-btn').onclick = sendMessage
    document.getElementById('logout-btn').onclick = logout
    document.getElementById('new-session-btn').onclick = startNewSession

    document.getElementById('msg-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    document.getElementById('msg-input').addEventListener('input', function() {
      autoResize(this)
    })

    function showAuth() {
      document.getElementById('auth-page').style.display = 'block'
      document.getElementById('chat-page').style.display = 'none'
    }

    async function showChat() {
      document.getElementById('auth-page').style.display = 'none'
      document.getElementById('chat-page').style.display = 'flex'
      if (!sessionId) {
        await createSession()
      }
      if (!document.getElementById('messages').children.length) {
        appendBot('你好，我是 DouyinMall 智能客服。你可以问我订单、库存、商品、退换货等问题。')
      }
    }

    function setAuthError(msg) {
      document.getElementById('auth-error').textContent = msg || ''
    }

    async function submitAuth() {
      const email = document.getElementById('email-input').value.trim()
      const password = document.getElementById('pwd-input').value

      if (!email || !password) {
        setAuthError('请填写邮箱和密码')
        return
      }

      const url = isLogin ? `${API}/auth/login` : `${API}/auth/signup`
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
        const json = await res.json()
        if (json.code !== 0) {
          setAuthError(json.msg || '操作失败')
          return
        }

        token = json.data.access_token
        refreshToken = json.data.refresh_token
        sessionId = ''
        localStorage.setItem('token', token)
        localStorage.setItem('refresh_token', refreshToken)
        localStorage.removeItem('session_id')
        document.getElementById('messages').innerHTML = ''
        await showChat()
      } catch (error) {
        setAuthError('网络错误，请检查后端服务是否启动')
      }
    }

    function setMode(nextMode) {
      mode = nextMode
      document.getElementById('btn-sync').classList.toggle('active', nextMode === 'sync')
      document.getElementById('btn-stream').classList.toggle('active', nextMode === 'stream')
    }

    async function createSession() {
      const res = await authFetch('/agent/api/session', {
        method: 'POST',
        body: JSON.stringify({ channel: 'web' })
      })
      const json = await res.json()
      if (json.code !== 0) {
        throw new Error(json.msg || '创建会话失败')
      }
      sessionId = json.data.session_id
      localStorage.setItem('session_id', sessionId)
    }

    async function startNewSession() {
      document.getElementById('messages').innerHTML = ''
      sessionId = ''
      localStorage.removeItem('session_id')
      try {
        await createSession()
        appendBot('已为你创建新的会话，可以继续提问。')
      } catch (error) {
        appendBot('创建新会话失败，请稍后重试。')
      }
    }

    function logout() {
      localStorage.clear()
      token = ''
      refreshToken = ''
      sessionId = ''
      sending = false
      document.getElementById('messages').innerHTML = ''
      showAuth()
    }

    async function sendMessage() {
      if (sending) return

      const input = document.getElementById('msg-input')
      const text = input.value.trim()
      if (!text) return

      if (!sessionId) {
        try {
          await createSession()
        } catch (error) {
          appendBot('当前无法创建会话，请稍后重试。')
          return
        }
      }

      input.value = ''
      autoResize(input)
      appendUser(text)
      setSending(true)

      try {
        if (mode === 'stream') {
          await sendStream(text)
        } else {
          await sendSync(text)
        }
      } finally {
        setSending(false)
      }
    }

    async function sendSync(text) {
      const loadingEl = appendBot('处理中...', true)
      try {
        const res = await authFetch('/agent/api/chat', {
          method: 'POST',
          body: JSON.stringify({ session_id: sessionId, message: text })
        })
        const json = await res.json()
        if (json.code !== 0) {
          updateBubble(loadingEl, '请求失败：' + (json.msg || '未知错误'))
          return
        }
        const data = json.data || {}
        updateBubble(loadingEl, data.reply || '暂无回复')
        renderExtras(data)
      } catch (error) {
        updateBubble(loadingEl, '网络错误，请稍后重试。')
      }
    }

    async function sendStream(text) {
      const bubbleEl = appendBot('', false, true)
      let stageEl = null

      try {
        const res = await authFetch('/agent/api/chat/stream', {
          method: 'POST',
          body: JSON.stringify({ session_id: sessionId, message: text })
        })

        if (!token) {
          bubbleEl.remove()
          return
        }

        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''

        while (true) {
          const { done, value } = await reader.read()
          if (done) break

          buffer += decoder.decode(value, { stream: true })
          const lines = buffer.split('\n')
          buffer = lines.pop()

          for (const rawLine of lines) {
            const line = rawLine.trim()
            if (!line.startsWith('data: ')) continue

            const payload = JSON.parse(line.slice(6))
            if (payload.stage !== undefined) {
              if (!stageEl) {
                stageEl = appendStage(payload.stage)
              } else {
                stageEl.textContent = stageLabel(payload.stage)
              }
              continue
            }

            if (payload.text !== undefined) {
              bubbleEl.dataset.raw = (bubbleEl.dataset.raw || '') + payload.text
              bubbleEl.textContent = bubbleEl.dataset.raw
              if (stageEl) {
                stageEl.remove()
                stageEl = null
              }
              scrollToBottom()
              continue
            }

            if (payload.reply !== undefined) {
              bubbleEl.classList.remove('streaming')
              bubbleEl.innerHTML = marked.parse(payload.reply || '')
              bubbleEl.querySelectorAll('a').forEach(a => a.target = '_blank')
              if (stageEl) {
                stageEl.remove()
                stageEl = null
              }
              renderExtras(payload)
              scrollToBottom()
              continue
            }

            if (payload.msg !== undefined) {
              bubbleEl.classList.remove('streaming')
              bubbleEl.textContent = '出错了：' + payload.msg
            }
          }
        }
      } catch (error) {
        bubbleEl.classList.remove('streaming')
        bubbleEl.textContent = '流式连接失败，请稍后重试。'
      } finally {
        bubbleEl.classList.remove('streaming')
      }
    }

    function appendUser(text) {
      const container = document.getElementById('messages')
      container.insertAdjacentHTML('beforeend', `
        <div class="msg user">
          <div class="avatar">我</div>
          <div class="bubble">${escHtml(text)}</div>
        </div>
      `)
      scrollToBottom()
    }

    function appendBot(text, loading = false, streaming = false) {
      const container = document.getElementById('messages')
      const wrapper = document.createElement('div')
      wrapper.className = 'msg bot'
      const bubbleClass = streaming ? 'bubble streaming' : 'bubble'
      wrapper.innerHTML = `
        <div class="avatar">AI</div>
        <div class="${bubbleClass}">${loading ? '处理中...' : escHtml(text)}</div>
      `
      container.appendChild(wrapper)
      scrollToBottom()
      return wrapper.querySelector('.bubble')
    }

    function updateBubble(el, markdownText) {
      el.classList.remove('streaming')
      el.innerHTML = marked.parse(markdownText || '')
      el.querySelectorAll('a').forEach(a => a.target = '_blank')
      scrollToBottom()
    }

    function appendStage(stage) {
      const el = document.createElement('div')
      el.className = 'stage-tip'
      el.textContent = stageLabel(stage)
      document.getElementById('messages').appendChild(el)
      scrollToBottom()
      return el
    }

    function renderExtras(data) {
      const questions = data && data.suggested_questions
      if (!questions || !questions.length) return

      const lastBubble = document.querySelector('.msg.bot:last-child .bubble')
      if (!lastBubble) return

      const wrap = document.createElement('div')
      wrap.className = 'suggested'
      questions.forEach(question => {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = question
        button.onclick = () => {
          document.getElementById('msg-input').value = question
          autoResize(document.getElementById('msg-input'))
          sendMessage()
        }
        wrap.appendChild(button)
      })
      lastBubble.parentElement.appendChild(wrap)
      scrollToBottom()
    }

    function stageLabel(stage) {
      return {
        session: '加载会话中',
        cache: '检查缓存中',
        intent: '识别意图中',
        retrieval: '检索知识中',
        generating: '生成回复中'
      }[stage] || stage
    }

    function setSending(value) {
      sending = value
      document.getElementById('send-btn').disabled = value
    }

    function scrollToBottom() {
      const container = document.getElementById('messages')
      container.scrollTop = container.scrollHeight
    }

    async function authFetch(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          ...(options.headers || {})
        }
      })

      if (response.status === 401) {
        const json = await response.clone().json().catch(() => ({}))
        if (json.code === 401 && refreshToken) {
          const refreshed = await doRefresh()
          if (refreshed) {
            return fetch(API + path, {
              ...options,
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                ...(options.headers || {})
              }
            })
          }
        }
        logout()
      }

      return response
    }

    async function doRefresh() {
      try {
        const response = await fetch(API + '/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken })
        })
        const json = await response.json()
        if (json.code !== 0) return false

        token = json.data.access_token
        refreshToken = json.data.refresh_token
        localStorage.setItem('token', token)
        localStorage.setItem('refresh_token', refreshToken)
        return true
      } catch (error) {
        return false
      }
    }

    function escHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    function autoResize(el) {
      el.style.height = 'auto'
      el.style.height = Math.min(el.scrollHeight, 120) + 'px'
    }
  </script>
</body>
</html>
