<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DouyinMall AI 客服</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== 登录页 ===== */
    #auth-page {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    #auth-page h2 { text-align: center; margin-bottom: 28px; color: #1a1a1a; font-size: 22px; }
    #auth-page input {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none;
      transition: border-color .2s;
    }
    #auth-page input:focus { border-color: #fe2c55; }
    #auth-page button {
      width: 100%; padding: 11px; background: #fe2c55; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
      transition: opacity .2s;
    }
    #auth-page button:hover { opacity: .88; }
    #auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: #666; }
    #auth-switch a { color: #fe2c55; cursor: pointer; }
    #auth-error { color: #e53e3e; font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 18px; }

    /* ===== 聊天页 ===== */
    #chat-page {
      display: none;
      width: 420px;
      height: 640px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      background: #fe2c55;
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #chat-header .title { font-size: 16px; font-weight: 600; }
    #chat-header .subtitle { font-size: 12px; opacity: .85; margin-top: 2px; }
    #chat-header button {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    #chat-header button:hover { background: rgba(255,255,255,.35); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .msg.user .avatar { background: #fe2c55; color: #fff; }
    .msg.bot  .avatar { background: #e8f4fd; color: #1890ff; }

    .bubble {
      padding: 10px 14px; border-radius: 12px; font-size: 14px;
      line-height: 1.55; max-width: 78%; word-break: break-word;
    }
    .msg.user .bubble { background: #fe2c55; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
    .msg.bot  .bubble { background: #f4f4f5; color: #1a1a1a; border-bottom-left-radius: 4px; }
    /* markdown 渲染样式 */
    .msg.bot .bubble p { margin: 0 0 6px; }
    .msg.bot .bubble p:last-child { margin-bottom: 0; }
    .msg.bot .bubble strong { font-weight: 600; }
    .msg.bot .bubble a { color: #fe2c55; text-decoration: none; }
    .msg.bot .bubble a:hover { text-decoration: underline; }
    .msg.bot .bubble ol, .msg.bot .bubble ul { padding-left: 18px; margin: 4px 0; }
    .msg.bot .bubble li { margin-bottom: 4px; }
    .bubble.streaming::after { content: "▍"; animation: blink .7s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .stage-tip {
      text-align: center; font-size: 11px; color: #aaa;
      padding: 2px 0;
    }

    .suggested {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .suggested button {
      background: #fff; border: 1px solid #fe2c55; color: #fe2c55;
      padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer;
      transition: all .15s;
    }
    .suggested button:hover { background: #fe2c55; color: #fff; }

    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #input-area textarea {
      flex: 1; border: 1px solid #ddd; border-radius: 8px;
      padding: 8px 12px; font-size: 14px; resize: none; outline: none;
      font-family: inherit; line-height: 1.5; max-height: 100px;
      transition: border-color .2s;
    }
    #input-area textarea:focus { border-color: #fe2c55; }
    #send-btn {
      background: #fe2c55; color: #fff; border: none; border-radius: 8px;
      padding: 0 18px; font-size: 14px; cursor: pointer; transition: opacity .2s;
    }
    #send-btn:hover { opacity: .88; }
    #send-btn:disabled { background: #ccc; cursor: default; }

    #mode-toggle {
      display: flex; gap: 8px; padding: 8px 14px 0;
      flex-shrink: 0;
    }
    #mode-toggle button {
      flex: 1; padding: 6px; border-radius: 6px; font-size: 12px;
      cursor: pointer; transition: all .15s; border: 1px solid #ddd;
      background: #fff; color: #666;
    }
    #mode-toggle button.active { background: #fe2c55; color: #fff; border-color: #fe2c55; }
  </style>
</head>
<body>

<!-- 登录/注册 -->
<div id="auth-page">
  <h2>🎵 DouyinMall</h2>
  <p id="auth-error"></p>
  <input id="email-input" type="email" placeholder="邮箱" autocomplete="email" />
  <input id="pwd-input" type="password" placeholder="密码" autocomplete="current-password" />
  <button id="auth-btn">登录</button>
  <p id="auth-switch">没有账号？<a id="switch-link">注册</a></p>
</div>

<!-- 聊天主界面 -->
<div id="chat-page">
  <div id="chat-header">
    <div>
      <div class="title">🤖 AI 智能客服</div>
      <div class="subtitle">DouyinMall · 随时为您服务</div>
    </div>
    <button id="logout-btn">退出</button>
  </div>

  <div id="mode-toggle">
    <button id="btn-sync" class="active" onclick="setMode('sync')">同步</button>
    <button id="btn-stream" onclick="setMode('stream')">流式 SSE</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="请输入您的问题…"></textarea>
    <button id="send-btn">发送</button>
  </div>
</div>

<script>
const API = 'http://localhost:8080'

// ===== 状态 =====
let token = localStorage.getItem('token') || ''
let refreshToken = localStorage.getItem('refresh_token') || ''
let sessionId = localStorage.getItem('session_id') || ''
let isLogin = true   // true=登录, false=注册
let mode = 'sync'    // 'sync' | 'stream'
let sending = false

// ===== 启动 =====
if (token) showChat()
else showAuth()

// ===== 登录/注册页 =====
function showAuth() {
  document.getElementById('auth-page').style.display = 'block'
  document.getElementById('chat-page').style.display = 'none'
}

document.getElementById('switch-link').onclick = () => {
  isLogin = !isLogin
  document.getElementById('auth-btn').textContent = isLogin ? '登录' : '注册'
  document.getElementById('switch-link').textContent = isLogin ? '注册' : '登录'
  document.querySelector('#auth-switch').firstChild.textContent = isLogin ? '没有账号？' : '已有账号？'
  document.getElementById('auth-error').textContent = ''
}

document.getElementById('auth-btn').onclick = async () => {
  const email = document.getElementById('email-input').value.trim()
  const password = document.getElementById('pwd-input').value
  if (!email || !password) { setAuthError('请填写邮箱和密码'); return }

  const url = isLogin ? `${API}/auth/login` : `${API}/auth/signup`
  try {
    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    const json = await res.json()
    if (json.code !== 0) { setAuthError(json.msg || '失败'); return }
    token = json.data.access_token
    refreshToken = json.data.refresh_token
    localStorage.setItem('token', token)
    localStorage.setItem('refresh_token', refreshToken)
    sessionId = ''
    localStorage.removeItem('session_id')
    showChat()
  } catch (e) {
    setAuthError('网络错误，请检查后端服务')
  }
}

// Enter 登录
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click()
})

function setAuthError(msg) {
  document.getElementById('auth-error').textContent = msg
}

// ===== 聊天页 =====
async function showChat() {
  document.getElementById('auth-page').style.display = 'none'
  const chatEl = document.getElementById('chat-page')
  chatEl.style.display = 'flex'

  // 确保有 session
  if (!sessionId) await createSession()

  appendBot('你好！我是 DouyinMall 智能客服，有什么可以帮您的？')
}

async function createSession() {
  try {
    const res = await authFetch('/agent/api/session', {
      method: 'POST', body: JSON.stringify({ channel: 'web' })
    })
    const json = await res.json()
    if (json.code === 0) {
      sessionId = json.data.session_id
      localStorage.setItem('session_id', sessionId)
    }
  } catch (e) { console.error('创建会话失败', e) }
}

document.getElementById('logout-btn').onclick = () => {
  localStorage.clear()
  token = ''; refreshToken = ''; sessionId = ''
  document.getElementById('messages').innerHTML = ''
  showAuth()
}

function setMode(m) {
  mode = m
  document.getElementById('btn-sync').classList.toggle('active', m === 'sync')
  document.getElementById('btn-stream').classList.toggle('active', m === 'stream')
}

// ===== 发送消息 =====
document.getElementById('send-btn').onclick = sendMessage
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
})

async function sendMessage() {
  if (sending) return
  const input = document.getElementById('msg-input')
  const text = input.value.trim()
  if (!text) return

  input.value = ''
  autoResize(input)
  appendUser(text)
  setSending(true)

  if (mode === 'stream') await sendStream(text)
  else await sendSync(text)

  setSending(false)
}

// 同步模式
async function sendSync(text) {
  const loadingEl = appendBot('…', true)
  try {
    const res = await authFetch('/agent/api/chat', {
      method: 'POST', body: JSON.stringify({ session_id: sessionId, message: text })
    })
    const json = await res.json()
    if (json.code !== 0) { updateBubble(loadingEl, '请求失败：' + json.msg); return }
    const d = json.data
    updateBubble(loadingEl, d.reply)
    renderExtras(d)
  } catch (e) {
    updateBubble(loadingEl, '网络错误')
  }
}

// 流式 SSE 模式
async function sendStream(text) {
  const bubbleEl = appendBot('', false, true) // streaming 样式
  let stageEl = null

  try {
    const res = await authFetch('/agent/api/chat/stream', {
      method: 'POST', body: JSON.stringify({ session_id: sessionId, message: text })
    })

    // authFetch 遇到无法恢复的认证错误时会调用 showAuth() 并返回原 response
    // 这里检查 token 是否还有效（showAuth 会清空 token）
    if (!token) { bubbleEl.remove(); return }

    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })

      const lines = buf.split('\n')
      buf = lines.pop() // 最后一行可能不完整

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          const event = line.slice(7).trim()
          // 下一行是 data:
          continue
        }
        if (line.startsWith('data: ')) {
          const raw = line.slice(6).trim()
          try {
            const payload = JSON.parse(raw)
            // 根据上一个 event 类型分发，这里用 payload 结构判断
            if (payload.stage !== undefined) {
              // stage 更新
              if (!stageEl) stageEl = appendStage(payload.stage)
              else stageEl.textContent = stageLabel(payload.stage)
            } else if (payload.text !== undefined) {
              // delta：流式阶段先用纯文本追加，done 时再整体 markdown 渲染
              bubbleEl.dataset.raw = (bubbleEl.dataset.raw || '') + payload.text
              bubbleEl.textContent = bubbleEl.dataset.raw
              scrollToBottom()
              if (stageEl) { stageEl.remove(); stageEl = null }
            } else if (payload.reply !== undefined) {
              // done：整体 markdown 渲染
              bubbleEl.classList.remove('streaming')
              bubbleEl.innerHTML = marked.parse(payload.reply)
              bubbleEl.querySelectorAll('a').forEach(a => a.target = '_blank')
              if (stageEl) { stageEl.remove(); stageEl = null }
              renderExtras(payload)
            } else if (payload.msg !== undefined) {
              bubbleEl.classList.remove('streaming')
              bubbleEl.textContent = '出错了：' + payload.msg
            }
          } catch {}
        }
      }
    }
    bubbleEl.classList.remove('streaming')
  } catch (e) {
    bubbleEl.classList.remove('streaming')
    bubbleEl.textContent = '流式连接失败'
  }
}

// ===== DOM 操作 =====
function appendUser(text) {
  const msgs = document.getElementById('messages')
  msgs.insertAdjacentHTML('beforeend', `
    <div class="msg user">
      <div class="avatar">我</div>
      <div class="bubble">${escHtml(text)}</div>
    </div>`)
  scrollToBottom()
}

function appendBot(text, loading = false, streaming = false) {
  const msgs = document.getElementById('messages')
  const cls = streaming ? 'bubble streaming' : 'bubble'
  const div = document.createElement('div')
  div.className = 'msg bot'
  div.innerHTML = `<div class="avatar">🤖</div><div class="${cls}">${loading ? '<span style="color:#aaa">思考中…</span>' : escHtml(text)}</div>`
  msgs.appendChild(div)
  scrollToBottom()
  return div.querySelector('.bubble')
}

function updateBubble(el, text) {
  el.innerHTML = marked.parse(text)
  // 所有链接新标签页打开
  el.querySelectorAll('a').forEach(a => a.target = '_blank')
  scrollToBottom()
}

function appendStage(stage) {
  const msgs = document.getElementById('messages')
  const el = document.createElement('div')
  el.className = 'stage-tip'
  el.textContent = stageLabel(stage)
  msgs.appendChild(el)
  scrollToBottom()
  return el
}

function renderExtras(data) {
  if (data.suggested_questions && data.suggested_questions.length) {
    const msgs = document.getElementById('messages')
    const last = msgs.querySelector('.msg.bot:last-child .bubble')
    if (!last) return
    const wrap = document.createElement('div')
    wrap.className = 'suggested'
    data.suggested_questions.forEach(q => {
      const btn = document.createElement('button')
      btn.textContent = q
      btn.onclick = () => {
        document.getElementById('msg-input').value = q
        sendMessage()
      }
      wrap.appendChild(btn)
    })
    last.parentElement.appendChild(wrap)
  }
}

function stageLabel(s) {
  return { session: '加载会话…', cache: '查询缓存…', intent: '理解意图…', retrieval: '检索知识…', generating: '生成回复…' }[s] || s
}

function scrollToBottom() {
  const msgs = document.getElementById('messages')
  msgs.scrollTop = msgs.scrollHeight
}

function setSending(v) {
  sending = v
  document.getElementById('send-btn').disabled = v
}

// ===== 工具 =====
// authFetch: 自动处理 access token 过期 → 用 refresh token 换新 token 后重试一次
async function authFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) }
  })

  // access token 过期，尝试刷新
  if (res.status === 401) {
    const json = await res.clone().json().catch(() => ({}))
    if (json.code === 401 && refreshToken) {
      const ok = await doRefresh()
      if (ok) {
        // 用新 token 重试一次
        return fetch(API + path, {
          ...opts,
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) }
        })
      }
    }
    // refresh 也失败，强制重新登录
    localStorage.clear()
    token = ''; refreshToken = ''; sessionId = ''
    showAuth()
  }
  return res
}

// doRefresh 用 refresh token 换新的 token pair，成功返回 true
async function doRefresh() {
  try {
    const res = await fetch(API + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    })
    const json = await res.json()
    if (json.code === 0) {
      token = json.data.access_token
      refreshToken = json.data.refresh_token
      localStorage.setItem('token', token)
      localStorage.setItem('refresh_token', refreshToken)
      return true
    }
  } catch {}
  return false
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

document.getElementById('msg-input').addEventListener('input', function() { autoResize(this) })
function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 100) + 'px'
}
</script>
</body>
</html>
