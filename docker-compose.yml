## 业务服务，走 etcd + 容器网络
x-microservice-common: &microservice-common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - mall-net
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  redis:
    image: redis:7.4-alpine
    container_name: douyinmall-redis
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - mall-net

  user-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/user:latest
    container_name: douyinmall-user
    ports:
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: user-service
      KITEX_PORT_TO_REGISTRY: 8091
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/order:latest
    container_name: douyinmall-order
    ports:
      - "8095:8095"
      - "19092:19092"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: order-service
      KITEX_PORT_TO_REGISTRY: 8095
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19092/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  inventory-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/inventory:latest
    container_name: douyinmall-inventory
    ports:
      - "8094:8094"
      - "19096:19096"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: inventory-service
      KITEX_PORT_TO_REGISTRY: 8094
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19096/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  product-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/product:latest
    container_name: douyinmall-product
    ports:
      - "8096:8096"
      - "19095:19095"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: product-service
      KITEX_PORT_TO_REGISTRY: 8096
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19095/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  cart-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/cart:latest
    container_name: douyinmall-cart
    ports:
      - "8099:8099"
      - "19094:19094"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: cart-service
      KITEX_PORT_TO_REGISTRY: 8099
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19094/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  coupon-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/coupon:latest
    container_name: douyinmall-coupon
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: coupon-service
      KITEX_PORT_TO_REGISTRY: 8097
    depends_on:
      redis:
        condition: service_healthy

  payment-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/payment:latest
    container_name: douyinmall-payment
    ports:
      - "8092:8092"
      - "8093:8093"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: payment-service
      KITEX_PORT_TO_REGISTRY: 8092
      ALIPAY_NOTIFY_URL: http://42.193.160.221:8093/api/pay/alipay/notify
      ALIPAY_RETURN_URL: http://42.193.160.221:8093/pay/success
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  checkout-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/checkout:latest
    container_name: douyinmall-checkout
    ports:
      - "8086:8086"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      KITEX_IP_TO_REGISTRY: checkout-service
      KITEX_PORT_TO_REGISTRY: 8086
    depends_on:
      coupon-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started

  seckill-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/seckill:latest
    container_name: douyinmall-seckill
    ports:
      - "8098:8098"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: seckill-service
      KITEX_PORT_TO_REGISTRY: 8098
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_started

  aftersale-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/aftersale:latest
    container_name: douyinmall-aftersale
    ports:
      - "8097:8097"
      - "19097:19097"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      KITEX_IP_TO_REGISTRY: aftersale-service
      KITEX_PORT_TO_REGISTRY: 8097
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19097/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/agent:latest
    container_name: douyinmall-agent
    command: ["./agent", "--config", "internal/agent/config/docker.yaml"]
    ports:
      - "8087:8087"
      - "18087:18087"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
      KITEX_IP_TO_REGISTRY: agent-service
      KITEX_PORT_TO_REGISTRY: 8087
    depends_on:
      aftersale-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  bff-service:
    <<: *microservice-common
    image: ccr.ccs.tencentyun.com/douyin-mall/bff:latest
    container_name: douyinmall-bff
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: host.docker.internal:2379
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      agent-service:
        condition: service_started

networks:
  mall-net:
    driver: bridge

volumes:
  redis-data:
