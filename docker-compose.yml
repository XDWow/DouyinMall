services:

  mysql:
    image: mysql:8.0
    container_name: douyinmall-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: douyinmall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - douyinmall-net

  redis:
    image: redis:7-alpine
    container_name: douyinmall-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - douyinmall-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: douyinmall-etcd
    restart: unless-stopped
    ports:
      - "12379:2379"
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd
    networks:
      - douyinmall-net

  kafka:
    image: apache/kafka:4.1.1
    container_name: douyinmall-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    networks:
      - douyinmall-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: douyinmall-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - douyinmall-net

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: douyinmall-milvus-etcd
    restart: unless-stopped
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - douyinmall-net

  milvus-minio:
    image: minio/minio:latest
    container_name: douyinmall-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus-minio-data:/data
    networks:
      - douyinmall-net

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: douyinmall-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - douyinmall-net

  mcpServer:
    build:
      context: ./backend
      dockerfile: cmd/mcp-tools/Dockerfile
    image: douyinmall-mcp-server
    container_name: douyinmall-mcpServer
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - etcd
    networks:
      - douyinmall-net

  user-service:
    build:
      context: ./backend
      dockerfile: cmd/user/Dockerfile
    container_name: douyinmall-user
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - mysql
      - redis
      - etcd
    networks:
      - douyinmall-net

  bff-service:
    build:
      context: ./backend
      dockerfile: cmd/bff/Dockerfile
    container_name: douyinmall-bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - redis
      - etcd
      - user-service
      - agent-service
    networks:
      - douyinmall-net

  agent-service:
    build:
      context: ./backend
      dockerfile: cmd/agent/Dockerfile
    container_name: douyinmall-agent
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${LLM_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - etcd
      - kafka
      - milvus
      - mcpServer
    networks:
      - douyinmall-net

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  es-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:

networks:
  douyinmall-net:
    driver: bridge