docker run -d \
--name douyinmall-kafka \
--hostname douyinmall-kafka \
--restart unless-stopped \
-p 127.0.0.1:9092:9092 \
-p 29092:29092 \
-e TZ=Asia/Taipei \
-e CLUSTER_ID=5L6g3nShT-eMCtK--X86sw \
-e KAFKA_NODE_ID=1 \
-e KAFKA_PROCESS_ROLES=broker,controller \
-e KAFKA_CONTROLLER_QUORUM_VOTERS=1@douyinmall-kafka:9093 \
-e KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093 \
-e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_HOST://10.1.4.4:29092 \
-e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT \
-e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
-e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
-e KAFKA_LOG_DIRS=/tmp/kraft-combined-logs \
-e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
-e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
-e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
-e KAFKA_DEFAULT_REPLICATION_FACTOR=1 \
-e KAFKA_NUM_PARTITIONS=3 \
-e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
-v douyinmall-kafka-data:/tmp/kraft-combined-logs \
apache/kafka:4.1.1

#KAFKA_PROCESS_ROLES=broker,controller：单节点 KRaft combined 模式。
#KAFKA_ADVERTISED_LISTENERS：客户端真正拿去连接的地址；官方文档明确说这里不能 0.0.0.0，所以必须填真实 IP。
#KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093：静态 controller voter 列表就是 {id}@{host}:{port} 这种格式。
#KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1：单节点要显式改成 1，不然 Kafka 默认会按更高副本数处理。官方 Docker 示例也专门提到这一点。
#KAFKA_NUM_PARTITIONS=3 和 KAFKA_AUTO_CREATE_TOPICS_ENABLE=true 都是合法的 broker 配置项，前者是默认分区数，后者默认就支持自动建 topic。