services:
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: douyinmall-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_PUBLISH_PORT:-16379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in env file}
      TZ: Asia/Shanghai
    command:
      - redis-stack-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in env file}
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis-data:
