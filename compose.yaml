# 基础中间件：MySQL / Redis / Kafka / Etcd（可单独用于远程服务器）
#
# 远程部署建议：
# 1. 在服务器项目根目录复制 .env.example 为 .env，填写 MYSQL_ROOT_PASSWORD、KAFKA_HOST 等。
# 2. KAFKA_HOST：填「客户端访问 Kafka 时用的主机名或 IP」。本机连本机用 127.0.0.1；
#    其它机器连该服务器上的 Kafka，填服务器内网 IP 或域名（与客户端 bootstrap 一致）。
# 3. 安全：生产环境用防火墙限制 13306/16379/12379/9092/29092，仅内网或跳板机访问；勿把 Redis/MySQL 暴露公网。
#
# 启动：docker compose --env-file .env up -d
# 若未提供 .env：docker compose up -d（密码默认 root，Kafka 广播为 localhost:29092）

services:
  mysql:
    image: mysql:8.0
    container_name: douyinmall-mysql
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-douyinmall}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - douyinmall-net

  redis:
    image: redis/redis-stack-server:latest
    container_name: douyinmall-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-stack-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - douyinmall-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: douyinmall-etcd
    restart: unless-stopped
    ports:
      - "12379:2379"
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd
    networks:
      - douyinmall-net

  kafka:
    image: apache/kafka:4.1.1
    container_name: douyinmall-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://${KAFKA_HOST:-127.0.0.1}:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - douyinmall-net

volumes:
  mysql-data:
  redis-data:
  etcd-data:

networks:
  douyinmall-net:
    driver: bridge
