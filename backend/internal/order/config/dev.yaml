db:
  host: "localhost"
  port: 13316
  user: "root"
  password: ""
  database: "DouyinMall"
  params: "charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"

etcd:
  endpoints:
    - "localhost:12379"

grpc:
  server:
    name: order.service
    port: 8095
    etcdTTL: 60

mcp:
  server:
    addr: ":19092"
    name: "order-mcp"
    version: "1.0.0"
  upstream:
    service_name: "order.service"
    direct_addr: "127.0.0.1:8095"
  tools:
    - key: "get_order"
      name: "get_order"
      description: "根据 order_id 查询单笔订单摘要；仅本人订单（与运行时 user_id 一致）。"
      enabled: true
    - key: "list_user_orders"
      name: "list_user_orders"
      description: "查询当前用户订单列表第一页，固定最多 10 条（用户来自 MCP 运行时上下文）。"
      enabled: true

kafka:
  brokers:
    - "10.1.4.4:29092"

canal:
  mysql:
    host: "localhost"
    port: 13316
    user: "root"
    password: ""
  server_id: 1234
