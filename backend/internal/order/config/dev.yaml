db:
  dsn: "root:root@tcp(localhost:13316)/DouyinMall"

redis:
  addr: "localhost:6379"

etcd:
  endpoints:
    - "localhost:12379"

grpc:
  server:
    name: order.service
    port: 8095
    etcdTTL: 60

mcp:
  server:
    addr: ":19092"
    name: "order-mcp"
    version: "1.0.0"
  upstream:
    service_name: "order.service"
    direct_addr: "127.0.0.1:8095"
  tools:
    - key: "query_order"
      name: "query_order"
      description: "Query the current user's orders."
      enabled: true

kafka:
  brokers:
    - "localhost:9092"

canal:
  mysql:
    host: "localhost"
    port: 13316
    user: "root"
    password: "root"
  server_id: 1234
