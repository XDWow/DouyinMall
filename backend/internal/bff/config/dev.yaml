http:
  addr: ":8080"

jwt:
  access_secret: "douyinmall-access-secret-dev"
  refresh_secret: "douyinmall-refresh-secret-dev"
  access_expiry: "2h"
  refresh_expiry: "168h"  # 7 天

redis:
  addr: "douyinmall-redis:6379"

# 全局 IP 限流（滑动窗口）
# interval 时间窗口内最多允许 rate 次请求
ratelimit:
  interval: "1m"
  rate: 100

etcd:
  endpoints:
    - "douyinmall-etcd:2379"

rpc:
  agent:
    service_name: "agent-service"
    direct_addr: "douyinmall-agent:8087"  # 容器名直连，绕过 etcd 服务发现
  user:
    service_name: "user-service"
    direct_addr: "douyinmall-user:8091"   # 容器名直连，绕过 etcd 服务发现
