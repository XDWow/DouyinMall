db:
  host: "localhost"
  port: 13306
  user: "root"
  password: ""
  database: "DouyinMall"
  params: "charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"

etcd:
  endpoints:
    - "localhost:12379"

grpc:
  server:
    name: inventory.service
    port: 8094

mcp:
  server:
    addr: ":19096"
    name: "inventory-mcp"
    version: "1.0.0"
  upstream:
    service_name: "inventory.service"
    direct_addr: "127.0.0.1:8094"
  tools:
    - key: "get_inventory"
      name: "get_inventory"
      description: "Get inventory stock by product id."
      enabled: true

kafka:
  brokers:
    - "10.1.4.4:29092"
