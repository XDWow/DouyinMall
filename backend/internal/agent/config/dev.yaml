grpc:
  server:
    port: 8087
    name: "agent"

etcd:
  endpoints:
    - "localhost:2379"

db:
  dsn: "root:root@tcp(localhost:3306)/douyinmall_agent?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"

llm:
  base_url: "https://api.openai.com/v1"
  api_key: "${LLM_API_KEY}"
  chat_model: "gpt-4o-mini"
  timeout_seconds: 30

embedding:
  base_url: "https://api.openai.com/v1"
  api_key: "${EMBEDDING_API_KEY}"
  model: "text-embedding-3-small"
  timeout_seconds: 10

milvus:
  addr: "localhost:19530"
  collection: "agent_knowledge"
