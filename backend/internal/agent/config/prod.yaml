grpc:
  server:
    port: 8087
    name: "agent-service"

http:
  addr: ":18087"
  prefix: "/api/agent"
  read_timeout_seconds: 30
  write_timeout_seconds: 120
  idle_timeout_seconds: 120

db:
  dsn: ""

redis:
  addr: "114.132.75.56:16379"
  password: ""
  db: 0

kafka:
  enabled: true
  brokers:
    - "10.1.4.4:29092"

etcd:
  endpoints:
    - "douyinmall-etcd:2379"

mcp:
  servers:
    - name: "order"
      endpoint: "http://localhost:19092/mcp"
      timeout_seconds: 10
      enabled: true
    - name: "search"
      endpoint: "http://localhost:19093/mcp"
      timeout_seconds: 10
      enabled: true
    - name: "cart"
      endpoint: "http://localhost:19094/mcp"
      timeout_seconds: 10
      enabled: true
    - name: "product"
      endpoint: "http://localhost:19095/mcp"
      timeout_seconds: 10
      enabled: true
    - name: "inventory"
      endpoint: "http://localhost:19096/mcp"
      timeout_seconds: 10
      enabled: true
    - name: "aftersale"
      endpoint: "http://localhost:19097/mcp"
      timeout_seconds: 10
      enabled: true

skill:
  enabled: true
  roots:
    - "internal/agent/skills"

tenant:
  default_id: "default"

llm:
  downgrade_one: true
  retry_times: 1
  weak:
    provider: "iflow"
    base_url: "https://apis.iflow.cn"
    api_key: ""
    model: "qwen3-max"
    timeout_seconds: 60
    temperature: 0
    max_tokens: 256
  strong:
    provider: "iflow"
    base_url: "https://apis.iflow.cn"
    api_key: ""
    model: "qwen3-max"
    timeout_seconds: 60
    temperature: 0.2
    max_tokens: 512

embedding:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  api_key: ""
  model: "qwen3-embedding:0.6b"
  timeout_seconds: 15

knowledge_base:
  qdrant:
    host: "your-qdrant-host"
    port: 6334
    api_key: ""
    collection: "agent_knowledge"
    use_tls: false
    score_threshold: 0.35

workflow:
  rate_limit_per_minute: 30
  conversation_window: 5
  exact_cache_ttl_seconds: 600
  semantic_cache_ttl_seconds: 1800
  semantic_cache_score: 0.9
  semantic_cache_top_k: 20
  retrieve_top_k: 8
  retrieve_min_score: 0.35
  confidence_threshold: 0.62
  max_answer_tokens: 512
  checkpoint_ttl_seconds: 604800
  interrupt_before_nodes: []

observability:
  log:
    level: "info"
    file: ""
  metrics:
    path: "/metrics"
  trace:
    enabled: false
    service_name: "agent-service"
    endpoint: ""
    insecure: true
    sample_ratio: 1.0
