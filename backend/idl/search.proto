syntax = "proto3";

package search;

option go_package = "search/v1;searchv1";

service SearchService {
    rpc SearchProducts(SearchProductsReq) returns (SearchProductsResp) {}
    rpc GetSearchAggregations(SearchProductsReq) returns (SearchAggregationsResp) {}
    rpc SearchMerchants(SearchMerchantsReq) returns (SearchMerchantsResp) {}
    rpc SearchSuggest(SearchSuggestReq) returns (SearchSuggestResp) {}
    rpc InitES(InitESReq) returns (InitESResp) {}
    rpc AISearchProducts(AISearchProductsReq) returns (AISearchProductsResp) {}
}

message SearchProductsReq {
    string keyword = 1;
    int64 page = 2;
    int64 page_size = 3;
    repeated string categories = 4;
    int64 min_price = 5;
    int64 max_price = 6;
    int64 merchant_id = 7;
    SortType sort_by = 8;
    bool enable_highlight = 9;
}

enum SortType {
    RELEVANCE = 0;
    PRICE_ASC = 1;
    PRICE_DESC = 2;
    SALES_DESC = 3;
    NEW_ARRIVAL = 4;
}

message SearchProductsResp {
    repeated ProductSearchResult products = 1;
    int64 total = 2;
    int64 page = 3;
    int64 page_size = 4;
}

message ProductSearchResult {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string picture = 4;
    repeated string slider_imgs = 5;
    int64 price = 6;
    repeated string categories = 7;
    bool in_stock = 8;
    int64 merchant_id = 9;
    string merchant_name = 10;
    float score = 11;
    string name_highlight = 12;
    string description_highlight = 13;
}

message SearchSuggestReq {
    string keyword = 1;
    int64 limit = 2;
    SuggestType type = 3;
}

enum SuggestType {
    PRODUCT = 0;
    MERCHANT = 1;
}

message SearchSuggestResp {
    repeated SearchSuggestion suggestions = 1;
}

message SearchSuggestion {
    string keyword = 1;
    SuggestSource source = 2;
    int64 count = 3;
}

enum SuggestSource {
    HISTORY = 0;
    HOT = 1;
    NAME_MATCH = 2;
}

message SearchAggregationsResp {
    repeated CategoryAggregation categories = 1;
    repeated PriceRangeAggregation price_ranges = 2;
}

message CategoryAggregation {
    string category = 1;
    int64 count = 2;
}

message PriceRangeAggregation {
    int64 min_price = 1;
    int64 max_price = 2;
    int64 count = 3;
    string label = 4;
}

message SearchMerchantsReq {
    string keyword = 1;
    int64 page = 2;
    int64 page_size = 3;
    string region = 4;
    float min_rating = 5;
    bool verified_only = 6;
    MerchantSortType sort_by = 7;
}

enum MerchantSortType {
    MERCHANT_RELEVANCE = 0;
    MERCHANT_SALES_DESC = 1;
    MERCHANT_RATING_DESC = 2;
    MERCHANT_NEW_ARRIVAL = 3;
}

message SearchMerchantsResp {
    repeated MerchantSearchResult merchants = 1;
    int64 total = 2;
    int64 page = 3;
    int64 page_size = 4;
}

message MerchantSearchResult {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string logo = 4;
    string region = 5;
    float rating = 6;
    int64 sales_count = 7;
    int64 product_count = 8;
    bool verified = 9;
    float score = 10;
    string name_highlight = 11;
}

message InitESReq {
    bool recreate_indices = 1;
    bool sync_products = 2;
    bool sync_merchants = 3;
    int64 batch_size = 4;
}

message InitESResp {
    bool success = 1;
    string message = 2;
    bool indices_created = 3;
    int64 products_synced = 4;
    int64 products_failed = 5;
    int64 merchants_synced = 6;
    int64 merchants_failed = 7;
    repeated string errors = 8;
}

message AISearchProductsReq {
    string query = 1;
    int64 page = 2;
    int64 page_size = 3;
    bool enable_rag = 4;
    bool enable_highlight = 5;
}

message AISearchProductsResp {
    repeated ProductSearchResult products = 1;
    int64 total = 2;
    int64 page = 3;
    int64 page_size = 4;
    QueryIntent query_intent = 5;
    string rag_summary = 6;
    PipelineMetrics metrics = 7;
}

message QueryIntent {
    string rewritten_query = 1;
    repeated string categories = 2;
    int64 min_price = 3;
    int64 max_price = 4;
    string sort_by = 5;
    string intent = 6;
    bool need_rag = 7;
}

message PipelineMetrics {
    int64 query_understanding_ms = 1;
    int64 keyword_recall_ms = 2;
    int64 vector_recall_ms = 3;
    int64 ranking_ms = 4;
    int64 fetch_ms = 5;
    int64 rag_ms = 6;
    int64 total_ms = 7;
    int32 keyword_recall_count = 8;
    int32 vector_recall_count = 9;
}
