syntax = "proto3";

package agent;

option go_package = "agent/v1;agentv1";

// 客服服务
// 四阶段 Pipeline：会话加载 → 意图识别+Query改写 → RAG检索 → 回复生成
service AgentService {
  // 处理用户消息，返回 AI 回复
  rpc SendMessage(ChatRequest) returns (ChatResponse);

  // 流式对话：Pipeline 阶段状态 + 逐字生成 + 调试信息
  rpc SendMessageStream(ChatRequest) returns (stream ChatStreamChunk);

  // 获取某个会话的对话历史（分页）
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);

  // 创建新对话会话
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // 获取用户的会话列表
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // 清空会话（重新开始对话）
  rpc ClearSession(ClearSessionRequest) returns (ClearSessionResponse);
}

message ChatRequest {
  string session_id = 1;
  int64  user_id    = 2;
  string message    = 3;
}

message ChatResponse {
  string                reply              = 1;  // AI 回复内容
  IntentType            intent             = 2;  // 识别出的意图
  reserved               3;                      // 原 confidence 字段已移除（内部指标，由 Prometheus 记录，不对外暴露）
  reserved              "confidence";
  repeated KnowledgeRef knowledge          = 4;  // 命中的知识条目（透明可解释）
  repeated ToolExec     tool_execs         = 5;  // 本次触发的工具调用链（Phase 2）
  repeated string       suggested_questions = 6; // 主动推荐的关联问题（2~3 个）
  HandoffSummary        handoff            = 7;  // 转人工交接摘要（仅转人工时附带）
}

// 流式回复单个分片
// STAGE_UPDATE: Pipeline 阶段状态推送
message ChatStreamChunk {
  ChunkType     type       = 1;
  string        text       = 2;  // TEXT_DELTA 时为文本增量
  string        stage      = 3;  // STAGE_UPDATE 时标识当前阶段
  ChatResponse  final      = 4;  // DONE 时携带完整响应（含 debug/handoff/suggested_questions）
}

enum ChunkType {
  STAGE_UPDATE = 0;  // Pipeline 阶段状态推送
  TEXT_DELTA   = 1;  // 回复文本增量（逐字/逐句）
  DONE         = 2;  // 结束标记
}

// ==================== 会话管理 ====================

message CreateSessionRequest {
  int64  user_id = 1;
  string channel = 2;
}

message CreateSessionResponse {
  string session_id = 1;
}

message ListSessionsRequest {
  int64 user_id  = 1;
  int32 limit    = 2;  // 默认 10
  int32 offset   = 3;
}

message ListSessionsResponse {
  repeated SessionBrief sessions = 1;
  int32 total = 2;
}

// SessionBrief 会话摘要（列表展示用）
message SessionBrief {
  string        session_id   = 1;
  string        last_message = 2;  // 最后一条消息预览
  SessionStatus status       = 3;
  string        created_at   = 4;
  string        updated_at   = 5;
  int32         total_turns  = 6;
}

message GetChatHistoryRequest {
  string session_id = 1;
  int32  limit      = 2;  // 默认 20
  int32  offset     = 3;
}

message GetChatHistoryResponse {
  repeated Message messages = 1;
  int32 total = 2;
}

message ClearSessionRequest {
  string session_id = 1;
}

message ClearSessionResponse {
  bool success = 1;
}

// ==================== 数据模型 ====================

message Message {
  string      id         = 1;
  string      session_id = 2;
  MessageRole role       = 3;
  string      content    = 4;
  IntentType  intent     = 5;   // assistant 消息的识别意图
  float       confidence = 6;   // assistant 消息的置信度
  string      created_at = 7;
}

// HandoffSummary AI → 人工客服的结构化交接摘要
// 让人工客服一眼看清 AI 已做的事和用户诉求项
message HandoffSummary {
  string            core_issue        = 1;  // 一句话概括用户核心诉求
  repeated string   ai_actions        = 2;  // AI 已经做了什么
  string            escalation_reason = 3;  // 为什么需要转人工
  string            user_emotion      = 4;  // neutral/mild_frustration/angry/urgent
  map<string,string> entities         = 5;  // 关键实体（订单号、商品名等）
  reserved 6; reserved "confidence_trend";
}

// KnowledgeRef RAG 命中的知识条目引用
message KnowledgeRef {
  string id        = 1;
  string title     = 2;
  string content   = 3;  // chunk 完整内容
  string category  = 4;  // faq / product / policy / promotion
  float  relevance = 5;  // 相关性得分
}

// ToolExec 工具调用执行记录（Phase 2）
message ToolExec {
  string            tool_name  = 1;  // get_order / search_product / get_logistics
  map<string,string> params    = 2;  // 调用参数
  string            reasoning  = 3;  // LLM 给出的调用理由
  bool              success    = 4;
  string            result     = 5;  // 执行结果（JSON）
  string            error      = 6;  // 失败原因
  int64             latency_ms = 7;
}

// ==================== 枚举 ====================

enum MessageRole {
  ROLE_UNKNOWN   = 0;
  ROLE_USER      = 1;
  ROLE_ASSISTANT = 2;
  ROLE_SYSTEM    = 3;  // 系统提示（不对用户展示）
  ROLE_TOOL      = 4;  // 工具调用结果（Phase 2）
}

enum IntentType {
  INTENT_UNKNOWN           = 0;
  INTENT_FAQ               = 1;   // 常见问题
  INTENT_PRODUCT_INQUIRY   = 2;   // 商品咨询
  INTENT_ORDER_INQUIRY     = 3;   // 订单查询
  INTENT_LOGISTICS         = 4;   // 物流查询
  INTENT_PAYMENT           = 5;   // 支付问题
  INTENT_RETURN            = 6;   // 退货退款
  INTENT_COMPLAINT         = 7;   // 投诉建议
  INTENT_PROMOTION         = 8;   // 营销活动
  INTENT_CHITCHAT          = 9;   // 闲聊
  INTENT_TRANSFER_TO_HUMAN = 10;  // 转人工
}

enum SessionStatus {
  SESSION_ACTIVE    = 0;  // 活跃
  SESSION_CLOSED    = 1;  // 已结束
  SESSION_HUMAN     = 2;  // 已转人工
}
