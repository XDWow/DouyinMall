syntax = "proto3";

package checkout.v1;

option go_package = "checkout/v1;checkoutv1";

service CheckoutService {
    rpc PreviewOrder(PreviewOrderReq) returns (PreviewOrderResp);
    rpc PlaceOrder(PlaceOrderReq) returns (PlaceOrderResp);
    rpc PayOrder(PayOrderReq) returns (PayOrderResp);
}

message CheckoutItem {
    int64 product_id = 1;
    int64 quantity = 2;
}

message Address {
    string receiver_name = 1;
    string phone = 2;
    string province = 3;
    string city = 4;
    string district = 5;
    string street = 6;
    string zip_code = 7;
}

message PreviewOrderReq {
    int64 user_id = 1;
    repeated CheckoutItem items = 2;
}

message PreviewOrderResp {
    repeated ProductDetail products = 1;
    repeated CouponItem available_coupons = 3;
}

message ProductDetail {
    int64 product_id = 1;
    string name = 2;
    string picture = 3;
    int64 price = 4;
    string currency = 5;
    int64 quantity = 6;
    int64 subtotal = 7;
    bool available = 8;
    string unavailable_reason = 9;
}

message CouponItem {
    int64 coupon_id = 1;
    string name = 2;
    string description = 3;
    int64 discount_amount = 4;
    bool usable = 5;
    string unusable_reason = 6;
    map<int64, int64> per_line_discounts = 7;
}

message PlaceOrderReq {
    int64 user_id = 1;
    repeated CheckoutItem items = 2;
    repeated int64 coupon_ids = 3;
    Address address = 4;
    string payment_method = 5;
    string currency = 6;
    string remark = 7;
    int64 expected_amount = 8;
    string order_kind = 9;
}

message PlaceOrderResp {
    int64 order_id = 1;
    string payment_url = 2;
    int64 total_amount = 3;
    int64 expire_at = 4;
}

message PayOrderReq {
    int64 user_id = 1;
    int64 order_id = 2;
}

message PayOrderResp {
    int64 order_id = 1;
    string payment_url = 2;
    int64 total_amount = 3;
    int64 expire_at = 4;
}
