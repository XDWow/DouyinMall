syntax = "proto3";

package product;

option go_package = "product/v1;productv1";

service ProductService {
    // List product cards.
    rpc ListProducts(ListProductsReq) returns (ListProductsResp) {}
    // Get one or more product details. Prefer items when SKU-aware pricing is needed.
    rpc GetProducts(GetProductsReq) returns (GetProductsResp) {}
    // Create a product and optionally its default SKU.
    rpc CreateProduct(CreateProductReq) returns (CreateProductResp) {}
    // Update a product and optionally one SKU.
    rpc UpdateProduct(UpdateProductReq) returns (UpdateProductResp) {}
    // Delete a product owned by a merchant.
    rpc DeleteProduct(DeleteProductReq) returns (DeleteProductResp) {}
}

message Product {
    int64 id = 1; // Product ID.
    string name = 2; // Product name.
    string description = 3; // Product description.
    string picture = 4; // Cover image URL.
    repeated string sliderImgs = 5; // Gallery image URLs.
    int64 price = 6; // Price in minor units, for example cents/fen.
    repeated string categories = 7; // Category labels.
    bool in_stock = 8; // Availability flag; exact inventory is owned by inventory service.
    int64 merchantID = 9; // Merchant ID.
    string merchantName = 10; // Merchant name.
    string currency = 11; // Currency code, for example CNY or USD.
    int64 sku_id = 12; // SKU ID used for SKU-specific price and stock.
}

message CreateProductReq {
    Product product = 1;
}

message CreateProductResp {
    int64 id = 1;
}

message UpdateProductReq {
    Product product = 1;
}

message UpdateProductResp {
    int64 id = 1;
}

message DeleteProductReq {
    int64 id = 1;
    int64 user_id = 2;
}

message DeleteProductResp {
}

message ListProductsReq {
    int64 page = 1;
    int64 pageSize = 2;
    string category = 3;
}

message ListProductsResp {
    repeated Product products = 1;
}

message ProductQuery {
    int64 product_id = 1;
    int64 sku_id = 2;
}

message GetProductsReq {
    repeated ProductQuery items = 1;
}

message GetProductsResp {
    repeated Product product = 1;
}
