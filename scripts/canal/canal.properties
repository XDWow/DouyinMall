# ============================================
# Canal 服务器配置（简化版）
# ============================================

# Canal 服务器端口
canal.port = 11111

# 运行模式：kafka（发送到 Kafka）
canal.serverMode = kafka

# 实例名称（对应 conf/DouyinMall/ 目录）
canal.destinations = DouyinMall

# 自动扫描实例目录
canal.auto.scan = true

# ============================================
# Kafka 配置
# ============================================
kafka.bootstrap.servers = 10.1.4.4:29092

